<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagnóstico — Inventario MyL</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181d; color: #e8e8ea; padding: 16px; line-height: 1.5; }
  h1 { font-size: 18px; }
  .ok { color: #4caf50; font-weight: bold; }
  .bad { color: #f44336; font-weight: bold; }
  .box { background: #22252c; border: 1px solid #333; border-radius: 8px; padding: 12px; margin: 12px 0; }
  code { background: #000; padding: 2px 6px; border-radius: 4px; font-size: 13px; word-break: break-all; }
  ul { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>
<h1>Diagnóstico de datos — Inventario MyL</h1>
<p>Esta página pide los mismos tres archivos que la app, con el mismo cache-busting, y te dice exactamente qué llegó a tu dispositivo. No usa nada guardado en tu navegador.</p>
<div id="out" class="box">Cargando…</div>

<script>
async function run() {
  const out = document.getElementById("out");
  const v = Date.now();
  const lines = [];
  try {
    const [cardsRes, customRes] = await Promise.all([
      fetch(`./data/cards.json?v=${v}`).then(r => r.json()),
      fetch(`./data/custom-cards.json?v=${v}`).then(r => r.json()),
    ]);
    const cards = cardsRes.cards || cardsRes || [];
    const custom = customRes.cards || [];
    lines.push(`<p><b>data/cards.json</b>: ${cards.length} cartas totales</p>`);
    lines.push(`<p><b>data/custom-cards.json</b>: ${custom.length} cartas totales</p>`);

    const check = (slug, esperado) => {
      const a = cards.filter(c => c.edition === slug);
      const b = custom.filter(c => c.edition === slug);
      const all = [...a, ...b];
      const edids = all.map(c => parseInt(c.edid, 10)).filter(n => Number.isFinite(n)).sort((x, y) => x - y);
      const especiales = all.filter(c => c.specialId).length;
      const faltantes = [];
      for (let n = 1; n <= esperado; n++) if (!edids.includes(n)) faltantes.push(n);
      const cls = (all.length >= esperado) ? "ok" : "bad";
      lines.push(`<div class="box">
        <p><b>${slug}</b>: <span class="${cls}">${all.length} cartas</span> (${a.length} de cards.json + ${b.length} de custom-cards.json)</p>
        <p>Numeradas: ${edids.length} · Especiales: ${especiales}</p>
        ${faltantes.length ? `<p class="bad">Números 1-${esperado} que faltan: ${faltantes.join(", ")}</p>` : `<p class="ok">Sin huecos en 1-${esperado} ✓</p>`}
      </div>`);
    };
    check("toolkit_primera_era_2024", 40);
    check("toolkit_primera_era_2025", 32);

    lines.push(`<p style="margin-top:16px;color:#888;font-size:12px">User-Agent: ${navigator.userAgent}</p>`);
    lines.push(`<p style="color:#888;font-size:12px">Hora: ${new Date().toISOString()}</p>`);
    out.innerHTML = lines.join("\n");
  } catch (e) {
    out.innerHTML = `<p class="bad">Error al cargar: ${e.message}</p>`;
  }
}
run();
</script>
</body>
</html>
